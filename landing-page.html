<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Your Free Retail PDF!</title>
    <meta property="og:title" content="VMSD - Get Your Free Retail PDF!">
    <meta property="og:description" content="Sign up to receive your FREE PDF: 'Mastering Retail Visual Merchandising' and get updates on VMSD's launch!">
    <meta property="og:image" content="https://vmsd.info/F739069B-35E8-40C6-9E2A-EC93D3855A8D.png">
    <meta property="og:url" content="https://vmsd.info/landing-page.html">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Baloo+2:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #87CEEB 0%, #98D8C8 50%, #90EE90 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }
        h1 {
            font-family: 'Baloo 2', cursive;
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1em;
            margin-bottom: 30px;
            color: #555;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
        }
        input[type="email"],
        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="email"]:focus,
        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            border-color: #3498db;
            outline: none;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .checkbox-group label {
            display: inline-block;
            margin-left: 10px;
            font-weight: normal;
        }
        .button-submit {
            background-color: #2ecc71;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }
        .button-submit:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }
        .response-message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            font-weight: 600;
            display: none;
        }
        .response-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .response-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Unlock Your Retail Potential!</h1>
        <p>Sign up below to receive your **FREE PDF: "Mastering Retail Visual Merchandising"** and get updates on VMSD's launch!</p>

        <form id="landingPageForm">
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="your@example.com" required>
            </div>

            <div class="form-group">
                <label for="pdf_requested">Which free PDF are you interested in?</label>
                <select id="pdf_requested" name="pdf_requested" required>
                    <option value="">-- Select a PDF --</option>
                    <option value="Mastering Retail Visual Merchandising">Mastering Retail Visual Merchandising</option>
                    <option value="Advanced Store Layout Techniques">Advanced Store Layout Techniques</option>
                    <option value="Customer Journey Mapping in Retail">Customer Journey Mapping in Retail</option>
                </select>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="newsletter_optin" name="newsletter_optin" value="1">
                <label for="newsletter_optin">Yes, I'd like to receive your retail insights newsletter.</label>
            </div>

            <div class="form-group">
                <label for="area_of_interest">What are your main areas of interest in retail? (e.g., store design, e-commerce, customer experience)</label>
                <textarea id="area_of_interest" name="area_of_interest" placeholder="Tell us what you'd like to learn..."></textarea>
            </div>
            
            <input type="hidden" name="source_page" value="free_pdf_landing">

            <button type="submit" class="button-submit">Get My Free PDF & Join Waiting List! 🚀</button>
        </form>

        <div id="responseMessage" class="response-message"></div>
    </div>

    <script>
        document.getElementById('landingPageForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const form = event.target;
            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });

            // Convert checkbox value to boolean
            data.newsletter_optin = formData.has('newsletter_optin');

            const responseMessage = document.getElementById('responseMessage');
            responseMessage.style.display = 'none';

            try {
                const response = await fetch('api/landing_page_signup.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if (result.success) {
                    responseMessage.classList.remove('error');
                    responseMessage.classList.add('success');
                    form.reset(); // Clear the form
                } else {
                    responseMessage.classList.remove('success');
                    responseMessage.classList.add('error');
                }
                responseMessage.textContent = result.message;
                responseMessage.style.display = 'block';

            } catch (error) {
                responseMessage.classList.remove('success');
                responseMessage.classList.add('error');
                responseMessage.textContent = 'An unexpected error occurred. Please try again.';
                responseMessage.style.display = 'block';
                console.error('Submission error:', error);
            }
        });
    </script>
</body>
</html>
